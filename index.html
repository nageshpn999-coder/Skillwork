  <!-- 📞 WhatsApp సహాయం — ఫారం కష్టంగా ఉన్నవారి కోసం. నంబర్ కింద script లో WA_HELP_NUMBER లో ఉంది -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="assets/data.js"></script>
<script>
if(!maybeShowLangOverlay()){ applyLang(); }
function afterLangReady(){ applyLang(); loadStats(); }

function loadStats(){
  const lbls = {
    te: {w:'నమోదైనవారు', j:'పని పోస్టింగ్‌లు'},
    en: {w:'Registered people', j:'Work postings'}
  };
  const L = lbls[getLang()||'te'];
  document.getElementById('statWorkersLbl').textContent = L.w;
  document.getElementById('statWorksLbl').textContent = L.j;
  Promise.all([
    db.collection('panipniWorkers').get(),
    db.collection('panipniWork').get()
  ]).then(([w,j])=>{
    // 50+ workers ఉన్నప్పుడే stats చూపించు — తక్కువ సంఖ్యలు కొత్తవారికి negative signal
    if(w.size >= 50){
      document.getElementById('statWorkers').textContent = w.size;
      document.getElementById('statWorks').textContent = j.size;
      document.getElementById('statsRow').style.display='flex';
    }
  }).catch(()=>{ /* stats optional */ });
}
if(getLang()) loadStats();

// ---- 📞 WhatsApp సహాయ బటన్ ----
// నంబర్ మార్చాలంటే ఇక్కడ మాత్రమే (91 తో, + లేకుండా). ఖాళీగా '' పెడితే బటన్ కనిపించదు.
const WA_HELP_NUMBER = '919959731120';
(function(){
  const el = document.getElementById('waHelp');
  if(!el || !WA_HELP_NUMBER) return;
  const en = getLang()==='en';
  const msg = en
    ? 'Hi, I need workers.\nWork: \nPlace: '
    : 'నమస్తే, నాకు వర్కర్స్ కావాలి.\nపని: \nఊరు: ';
  el.href = 'https://wa.me/' + WA_HELP_NUMBER + '?text=' + encodeURIComponent(msg);
  el.innerHTML = en
    ? 'Form difficult to fill? <b>📞 Tell us on WhatsApp</b>'
    : 'ఫారం నింపడం కష్టంగా ఉందా? <b>📞 WhatsApp లో చెప్పండి</b>';
  el.style.display = 'block';
})();
</script>
<script>
// ---- PWA install prompt ----
// Chrome/Android లో "install చేయవచ్చు" అని బ్రౌజర్ చెప్పినప్పుడు మాత్రమే banner చూపిస్తాం
let deferredPrompt = null;
const installBar = document.getElementById('installBar');

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  // user ఇంతకుముందు "తర్వాత" నొక్కి ఉంటే మళ్ళీ చూపించొద్దు
  if(localStorage.getItem('wp_install_dismissed') !== '1'){
    installBar.style.display = 'flex';
  }
});

document.getElementById('installBtn').addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBar.style.display = 'none';
});

document.getElementById('installLater').addEventListener('click', ()=>{
  localStorage.setItem('wp_install_dismissed','1');
  installBar.style.display = 'none';
});

// install అయ్యాక banner అవసరం లేదు
window.addEventListener('appinstalled', ()=>{ installBar.style.display='none'; });
</script>
<script>
// Service worker register — offline support + home screen install
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
