<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkPin — దగ్గరలో పని | Work Nearby</title>
<link rel="stylesheet" href="assets/style.css">
<!-- PWA: ఫోన్ హోమ్ స్క్రీన్‌లో app లాగా install అవ్వడానికి -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C5B39">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WorkPin">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="icon" href="assets/icons/icon-192.png">
</head>
<body>

<div class="lang-overlay" id="langOverlay">
  <div class="logo">🛠️</div>
  <h2>భాష ఎంచుకోండి<br>Choose Language</h2>
  <p>మీకు నచ్చిన భాషలో వాడుకోండి · Use in your preferred language</p>
  <button class="lang-btn te" onclick="chooseLang('te')">తెలుగు</button>
  <button class="lang-btn en" onclick="chooseLang('en')">English</button>
</div>

<div class="topbar">
  <div class="brand">WorkPin</div>
  <button class="lang-toggle" id="langToggle" onclick="toggleLang()">EN</button>
</div>

<div class="wrap">
  <div class="hero">
    <div class="halo">📍 Telangana</div>
    <h1 data-i-html="home_h1"></h1>
    <p class="sub" data-i="home_sub"></p>
  </div>

  <!-- PWA install prompt — Android/Chrome లో మాత్రమే కనిపిస్తుంది -->
  <div class="install-bar" id="installBar" style="display:none">
    <span data-i="install_app"></span>
    <div class="install-actions">
      <button id="installBtn" data-i="install_btn"></button>
      <button id="installLater" class="later" data-i="install_later"></button>
    </div>
  </div>

  <div class="stats" id="statsRow" style="display:none">
    <div class="stat"><b id="statWorkers">–</b><span id="statWorkersLbl"></span></div>
    <div class="stat"><b id="statWorks">–</b><span id="statWorksLbl"></span></div>
  </div>

  <a class="path-card worker" href="worker-enroll.html">
    <div class="icon">🧑‍🌾</div>
    <div class="txt">
      <b data-i="need_work"></b>
      <span data-i="need_work_sub"></span>
    </div>
  </a>

  <a class="path-card employer" href="find-workers.html">
    <div class="icon">🧱</div>
    <div class="txt">
      <b data-i="need_people"></b>
      <span data-i="need_people_sub"></span>
    </div>
  </a>

  <h2 data-i="already"></h2>
  <div class="mini-links">
    <a href="find-work.html" data-i="see_work"></a>
    <a href="find-workers.html" data-i="see_workers"></a>
    <a href="my-profile.html" data-i="my_profile"></a>
    <a href="settings.html" data-i="settings"></a>
  </div>

  <footer class="foot" data-i="foot"></footer>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/data.js"></script>
<script>
if(!maybeShowLangOverlay()){ applyLang(); }
function afterLangReady(){ applyLang(); loadStats(); }

function loadStats(){
  const lbls = {
    te: {w:'నమోదైన వర్కర్స్', j:'పని పోస్టింగ్‌లు'},
    en: {w:'Registered workers', j:'Work postings'}
  };
  const L = lbls[getLang()||'te'];
  document.getElementById('statWorkersLbl').textContent = L.w;
  document.getElementById('statWorksLbl').textContent = L.j;
  Promise.all([
    db.collection('panipniWorkers').get(),
    db.collection('panipniWork').get()
  ]).then(([w,j])=>{
    // 50+ workers ఉన్నప్పుడే stats చూపించు — తక్కువ సంఖ్యలు కొత్తవారికి negative signal
    if(w.size >= 50){
      document.getElementById('statWorkers').textContent = w.size;
      document.getElementById('statWorks').textContent = j.size;
      document.getElementById('statsRow').style.display='flex';
    }
  }).catch(()=>{ /* stats optional */ });
}
if(getLang()) loadStats();
</script>
<script>
// ---- PWA install prompt ----
// Chrome/Android లో "install చేయవచ్చు" అని బ్రౌజర్ చెప్పినప్పుడు మాత్రమే banner చూపిస్తాం
let deferredPrompt = null;
const installBar = document.getElementById('installBar');

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  // user ఇంతకుముందు "తర్వాత" నొక్కి ఉంటే మళ్ళీ చూపించొద్దు
  if(localStorage.getItem('wp_install_dismissed') !== '1'){
    installBar.style.display = 'flex';
  }
});

document.getElementById('installBtn').addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBar.style.display = 'none';
});

document.getElementById('installLater').addEventListener('click', ()=>{
  localStorage.setItem('wp_install_dismissed','1');
  installBar.style.display = 'none';
});

// install అయ్యాక banner అవసరం లేదు
window.addEventListener('appinstalled', ()=>{ installBar.style.display='none'; });
</script>
<script>
// Service worker register — offline support + home screen install
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
