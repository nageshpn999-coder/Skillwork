<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | WorkPin</title>
<link rel="stylesheet" href="assets/style.css">
<!-- PWA: ఫోన్ హోమ్ స్క్రీన్‌లో app లాగా install అవ్వడానికి -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C5B39">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WorkPin">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="icon" href="assets/icon-192.png">
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">←</a>
  <div class="brand" data-i="profile_title"></div>
  <button class="lang-toggle" id="langToggle" onclick="toggleLang()">EN</button>
</div>

<div class="wrap">
  <p class="sub" data-i="profile_sub"></p>

  <!-- ఫోన్ నంబర్ తో ప్రొఫైల్ వెతకడం — login అవసరం లేదు -->
  <label data-i="phone"></label>
  <input type="tel" id="pPhone" maxlength="10" data-i-ph="ph_phone">
  <button class="btn green" id="findBtn" data-i="find_profile" style="margin-top:14px"></button>

  <div id="profileList" style="margin-top:20px"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/data.js"></script>
<script>
if(!getLang()) setLang('te');
applyLang();

// db అనేది firebase-config.js లో ఇప్పటికే declare అయ్యింది — ఇక్కడ మళ్ళీ అవసరం లేదు
let myDocs = [];

// ఫోన్ నంబర్‌తో worker profile(s) వెతుకు
document.getElementById('findBtn').addEventListener('click', async ()=>{
  const phone = document.getElementById('pPhone').value.trim();
  if(!/^\d{10}$/.test(phone)){ showToast(t('err_phone')); return; }

  const list = document.getElementById('profileList');
  list.innerHTML = `<div class="loading">...</div>`;

  try{
    const snap = await db.collection('panipniWorkers').where('phone','==',phone).get();
    if(snap.empty){
      list.innerHTML = `<div class="empty"><span class="big">🔍</span>${t('profile_not_found')}</div>`;
      return;
    }
    myDocs = snap.docs;
    renderProfiles();
  }catch(e){
    list.innerHTML = `<div class="empty">${t('err_generic')}</div>`;
  }
});

function renderProfiles(){
  const list = document.getElementById('profileList');
  list.innerHTML = myDocs.map((doc,idx)=>{
    const d = doc.data();
    const busy = !!d.busy;
    return `
    <div class="card">
      <b class="name">${escHtml(d.name)} ${busy?`<span class="busybadge">${t('busy_badge')}</span>`:''}</b>
      <div class="place">📍 ${escHtml(d.village)}, ${d.customArea?escHtml(d.customArea):areaLabel(d.mandal)}, ${districtLabel(d.district)}</div>
      <div class="tags">${(d.skills||[]).map(s=>`<span class="tag">${skillLabel(s)}</span>`).join('')}</div>
      <!-- స్టేటస్ మార్చే బటన్లు — ఒక్క tap -->
      <div class="status-btns">
        <button class="stbtn free ${!busy?'on':''}" onclick="setStatus(${idx}, false)">${t('status_free')}</button>
        <button class="stbtn busy ${busy?'on':''}" onclick="setStatus(${idx}, true)">${t('status_busy')}</button>
      </div>

      <!-- 📍 ప్రస్తుతం ఉన్న ప్రాంతం — ఊరు మారినప్పుడు మార్చుకోవడానికి -->
      <div class="curloc">
        <div class="curloc-title">${t('cur_loc_title')}</div>
        <div class="curloc-help">${t('cur_loc_help')}</div>
        <button type="button" class="btn locbtn curloc-gps" onclick="useGpsLoc(${idx})">${t('use_my_loc')}</button>
        <div class="curloc-msg" id="locMsg${idx}" style="display:none"></div>
        <select id="locDist${idx}" onchange="syncLocArea(${idx})"></select>
        <div id="locAreaWrap${idx}" style="display:none">
          <select id="locArea${idx}"></select>
        </div>
        <div id="locMandalWrap${idx}">
          <input type="text" id="locMandal${idx}" data-i-ph="your_mandal">
        </div>
        <button class="btn green curloc-btn" onclick="saveLoc(${idx})">${t('cur_loc_save')}</button>
      </div>
    </div>`;
  }).join('');

  applyLang();
  // ప్రతి profile కి location dropdowns నింపు (ప్రస్తుత విలువతో)
  myDocs.forEach((doc, idx)=>{
    const d = doc.data();
    const dsel = document.getElementById('locDist'+idx);
    fillDistrictSelect(dsel);
    dsel.value = d.district || '';
    syncLocArea(idx);
    if(d.district === HYD_TE){
      const a = document.getElementById('locArea'+idx);
      if(a) a.value = d.mandal || '';
    } else {
      const m = document.getElementById('locMandal'+idx);
      if(m) m.value = d.mandal || '';
    }
  });
}

// హైదరాబాద్ అయితే ఏరియా dropdown, లేకపోతే మండలం text box
function syncLocArea(idx){
  const isHyd = document.getElementById('locDist'+idx).value === HYD_TE;
  document.getElementById('locAreaWrap'+idx).style.display = isHyd ? 'block' : 'none';
  document.getElementById('locMandalWrap'+idx).style.display = isHyd ? 'none' : 'block';
  if(isHyd) fillAreaSelect(document.getElementById('locArea'+idx));
}

// 📍 GPS తో ప్రాంతం auto-select — worker ఏదీ ఎంచుకోనవసరం లేదు
let gpsCoords = {};   // idx → {lat,lng}

async function useGpsLoc(idx){
  const msg = document.getElementById('locMsg'+idx);
  msg.style.display = 'block';
  msg.textContent = t('loc_detecting');

  const loc = await getMyLocation();
  if(!loc){
    msg.textContent = t('loc_denied_msg');   // deny అయినా manual ఎలాగూ ఉంది
    return;
  }

  gpsCoords[idx] = {lat: loc.lat, lng: loc.lng};

  // దగ్గరి జిల్లా auto-select
  const nd = nearestDistrict(loc.lat, loc.lng);
  const dsel = document.getElementById('locDist'+idx);
  if(nd){
    dsel.value = nd.te;
    syncLocArea(idx);
    // హైదరాబాద్ అయితే దగ్గరి ఏరియా కూడా
    if(nd.te === HYD_TE){
      const na = nearestHydArea(loc.lat, loc.lng);
      const asel = document.getElementById('locArea'+idx);
      if(na && asel) asel.value = na.te;
    }
  }
  msg.textContent = t('loc_set');
}

// ప్రస్తుత ప్రాంతం సేవ్ — listing లో ఇదే location కనిపిస్తుంది
async function saveLoc(idx){
  const dsel = document.getElementById('locDist'+idx);
  const isHyd = dsel.value === HYD_TE;
  const mandal = isHyd
    ? document.getElementById('locArea'+idx).value
    : document.getElementById('locMandal'+idx).value.trim();
  try{
    // GPS ఆధారిత పాత దూరం తప్పు కాకుండా lat/lng తీసేస్తాం — కొత్త ప్రాంతం బట్టి చూపిస్తుంది
    // GPS వాడితే కొత్త coords → ఖచ్చితమైన కి.మీ కనిపిస్తుంది
    // వాడకపోతే null → పాత ఊరి దూరం తప్పుగా చూపించకుండా
    const g = gpsCoords[idx];
    await myDocs[idx].ref.update({
      district: dsel.value,
      mandal: mandal,
      lat: g ? g.lat : null,
      lng: g ? g.lng : null
    });
    const snap = await db.collection('panipniWorkers').where('phone','==',document.getElementById('pPhone').value.trim()).get();
    myDocs = snap.docs;
    renderProfiles();
    showToast(t('cur_loc_saved'));
  }catch(e){
    console.error(e);
    showToast(t('err_generic'));
  }
}

// Firestore లో busy field update — listing లో వెంటనే ప్రతిఫలిస్తుంది
async function setStatus(idx, busy){
  try{
    await myDocs[idx].ref.update({busy: busy});
    // local data refresh
    const snap = await db.collection('panipniWorkers').where('phone','==',document.getElementById('pPhone').value.trim()).get();
    myDocs = snap.docs;
    renderProfiles();
    showToast(t('status_updated'));
  }catch(e){
    showToast(t('err_generic'));
  }
}
</script>
<script>
// Service worker register — offline support + home screen install
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
