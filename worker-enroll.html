<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | WorkPin</title>
<link rel="stylesheet" href="assets/style.css">
<!-- PWA: ఫోన్ హోమ్ స్క్రీన్‌లో app లాగా install అవ్వడానికి -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C5B39">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WorkPin">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="icon" href="assets/icons/icon-192.png">
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">←</a>
  <div class="brand" data-i="need_work"></div>
  <button class="lang-toggle" id="langToggle" onclick="toggleLang()">EN</button>
</div>

<div class="wrap">
  <h1 data-i="enroll_title"></h1>
  <p class="sub" data-i="enroll_sub"></p>

  <form id="wForm">
    <!-- Phase 3: GPS నుండి జిల్లా/ఏరియా auto-select బటన్ -->
    <button type="button" class="btn locbtn" id="useLocBtn"></button>
    <p class="note" id="locMsg" style="display:none;margin-top:6px"></p>

    <label data-i="your_name"></label>
    <input type="text" id="name" required data-i-ph="ph_name">

    <label data-i="phone"></label>
    <input type="tel" id="phone" required maxlength="10" data-i-ph="ph_phone">

    <label data-i="district"></label>
    <select id="district" required></select>

    <div id="mandalWrap">
      <label data-i="mandal"></label>
      <input type="text" id="mandal" data-i-ph="ph_mandal">
    </div>

    <div id="areaWrap" style="display:none">
      <label data-i="area"></label>
      <!-- Phase 3: area search box — టైప్ చేస్తే కింద dropdown filter అవుతుంది -->
      <input type="text" id="areaSearch" data-i-ph="search_area_ph" autocomplete="off" style="margin-bottom:8px">
      <select id="area"></select>
      <!-- "Other Area" select చేస్తే మాత్రమే కనిపించే custom area box -->
      <input type="text" id="customArea" data-i-ph="enter_area_ph" autocomplete="off" style="display:none;margin-top:8px">
    </div>

    <label data-i="village_opt"></label>
    <input type="text" id="village" data-i-ph="ph_village">

    <div class="group-label" data-i="skills_label"></div>
    <!-- Skill search — హైదరాబాద్ select చేసినప్పుడు మాత్రమే కనిపిస్తుంది -->
    <div id="skillFilterWrap" style="display:none">
      <input type="text" id="skillFilter" data-i-ph="skill_filter_ph" autocomplete="off" style="margin-bottom:8px">
    </div>
    <div id="skillBox"></div>

    <label data-i="available"></label>
    <!-- త్వరగా tap చేసే chips — typing అవసరం లేదు -->
    <div class="quick-label" data-i="quick_ready"></div>
    <div class="quick-chips" id="quickChips"></div>
    <input type="text" id="available" data-i-ph="ph_available">

    <!-- 🎓 Student/Part-time checkbox — అన్ని జిల్లాలకూ universal -->
    <label style="display:flex;align-items:center;gap:10px;font-weight:600;margin-top:18px;cursor:pointer">
      <input type="checkbox" id="isStudent" style="width:20px;height:20px;accent-color:var(--green)">
      <span data-i="student_checkbox"></span>
    </label>

    <button type="submit" class="btn green" data-i="submit_enroll"></button>

    <!-- Submit అయ్యాక కనిపిస్తుంది — వరుసగా enroll చేయడానికి -->
    <div class="add-another" id="addAnotherBar" style="display:none">
      <div class="ok-line" data-i="ok_enroll"></div>
      <button type="button" id="addAnotherBtn" data-i="add_another"></button>
      <a href="find-workers.html" data-i="see_workers"></a>
    </div>
    <p class="note" data-i="enroll_note"></p>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/data.js"></script>
<script>
if(!getLang()) setLang('te');
applyLang();

const districtSel = document.getElementById('district');
fillDistrictSelect(districtSel);
fillAreaSelect(document.getElementById('area'));
setupHydAreaSwitch(districtSel, document.getElementById('mandalWrap'), document.getElementById('areaWrap'));

// ---- Phase 3: 🔍 Area search (Hyderabad only) ----
// టైప్ చేసిన వెంటనే dropdown options filter అవుతాయి
const areaSearchEl = document.getElementById('areaSearch');
const areaSel = document.getElementById('area');
const customAreaEl = document.getElementById('customArea');

// "Other Area" select అయినప్పుడు మాత్రమే custom text box చూపించు
function syncCustomArea(){
  const isOther = areaSel.value===OTHER_AREA_TE;
  customAreaEl.style.display = isOther ? 'block' : 'none';
  if(!isOther) customAreaEl.value='';
}
areaSel.addEventListener('change', syncCustomArea);

areaSearchEl.addEventListener('input', ()=>{
  fillAreaSelect(areaSel, areaSearchEl.value);
  syncCustomArea(); // filter తర్వాత selected value మారొచ్చు
});

// ---- Phase 3: 📍 Use My Current Location ----
const useLocBtn = document.getElementById('useLocBtn');
const locMsg = document.getElementById('locMsg');
useLocBtn.textContent = t('use_my_loc');

useLocBtn.addEventListener('click', async ()=>{
  useLocBtn.disabled = true;
  useLocBtn.textContent = t('loc_detecting');
  const loc = await getMyLocation();
  useLocBtn.disabled = false;
  useLocBtn.textContent = t('use_my_loc');
  locMsg.style.display = 'block';

  if(!loc){
    // GPS deny అయినా/దొరకకపోయినా — మాన్యువల్‌గా కొనసాగవచ్చు
    locMsg.textContent = t('loc_denied_msg');
    return;
  }

  // దగ్గరి జిల్లా auto-select
  const nd = nearestDistrict(loc.lat, loc.lng);
  if(nd){
    districtSel.value = nd.te;
    districtSel.dispatchEvent(new Event('change')); // area/mandal switch + chips rebuild
  }
  // హైదరాబాద్ అయితే దగ్గరి area కూడా auto-select
  if(nd && nd.te===HYD_TE){
    const na = nearestHydArea(loc.lat, loc.lng);
    if(na){
      areaSearchEl.value='';
      fillAreaSelect(areaSel);
      areaSel.value = na.te;   // GPS ఎప్పుడూ named area నే select చేస్తుంది
      syncCustomArea();
    }
  }
  locMsg.textContent = t('loc_set');
});

const selectedSkills = new Set();
const skillFilterWrap = document.getElementById('skillFilterWrap');
const skillFilterEl = document.getElementById('skillFilter');

function rebuildChips(){
  const isHyd = districtSel.value===HYD_TE;
  const groups = isHyd ? SKILL_GROUPS_URBAN : SKILL_GROUPS;
  // Skill search box అన్ని జిల్లాలకూ — rural లో professional skills search చేస్తేనే కనిపిస్తాయి
  skillFilterWrap.style.display = 'block';
  skillFilterEl.value='';
  buildSkillChips(document.getElementById('skillBox'), selectedSkills, groups, '', false);
}
districtSel.addEventListener('change', rebuildChips);
rebuildChips();

// టైప్ చేస్తుండగానే chips filter — Firebase query లేదు, selections preserve
// హైదరాబాద్: urban list లో వెతుకుతుంది
// ఇతర జిల్లాలు: local list + professional (urban) list రెండింటిలో — hidden professions search లోనే కనిపిస్తాయి
skillFilterEl.addEventListener('input', ()=>{
  const isHyd = districtSel.value===HYD_TE;
  const f = skillFilterEl.value.trim();
  let groups;
  if(isHyd){
    groups = SKILL_GROUPS_URBAN;
  } else {
    groups = f ? [...SKILL_GROUPS, ...SKILL_GROUPS_URBAN] : SKILL_GROUPS;
  }
  buildSkillChips(document.getElementById('skillBox'), selectedSkills, groups, f, true);
});

document.getElementById('wForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const phone = cleanPhone(document.getElementById('phone').value);
  if(phone.length!==10){ showToast(t('err_phone')); return; }
  if(selectedSkills.size===0){ showToast(t('err_skill')); return; }

  const isHyd = districtSel.value===HYD_TE;
  const mandalVal = isHyd ? areaSel.value : document.getElementById('mandal').value.trim();
  // "Other Area" అయితే user టైప్ చేసిన పేరు customArea గా save (కొత్త field — existing fields మారవు)
  const customAreaVal = (isHyd && areaSel.value===OTHER_AREA_TE) ? customAreaEl.value.trim() : '';

  const loc = await getMyLocation();

  const data = {
    name: document.getElementById('name').value.trim(),
    phone: phone,
    district: districtSel.value,
    mandal: mandalVal,
    customArea: customAreaVal,
    village: document.getElementById('village').value.trim(),
    skills: Array.from(selectedSkills),
    available: document.getElementById('available').value.trim(),
    partTime: document.getElementById('isStudent').checked,
    lat: loc ? loc.lat : null,
    lng: loc ? loc.lng : null,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  try{
    await db.collection('panipniWorkers').add(data);
    showToast(t('ok_enroll'));
    // Adda దగ్గర వరుసగా enroll చేయడానికి — "ఇంకొకరిని చేర్చండి" చూపిస్తాం
    showAddAnother();
  }catch(err){
    console.error(err);
    showToast(t('err_generic'));
  }
});

// ---- వరుస enrollments కోసం ----
// జిల్లా/ఏరియా అలాగే ఉంచి, వ్యక్తిగత fields మాత్రం clear చేస్తుంది
function showAddAnother(){
  const bar = document.getElementById('addAnotherBar');
  bar.style.display = 'block';
  window.scrollTo({top: bar.offsetTop - 120, behavior: 'smooth'});
}

document.getElementById('addAnotherBtn').addEventListener('click', ()=>{
  // వ్యక్తిగత వివరాలు clear (district/area/mandal అలాగే ఉంటాయి — వేగం కోసం)
  ['name','phone','village','available'].forEach(id=>{ document.getElementById(id).value=''; });
  document.getElementById('isStudent').checked = false;
  // skills clear
  selectedSkills.clear();
  document.querySelectorAll('#skillBox .chip.on').forEach(c=>c.classList.remove('on'));
  document.querySelectorAll('#quickChips .qchip.on').forEach(c=>c.classList.remove('on'));
  document.getElementById('addAnotherBar').style.display='none';
  document.getElementById('name').focus();
  window.scrollTo({top:0, behavior:'smooth'});
});

// ---- Quick chips (ఎప్పటి నుండి రెడీ) ----
// tap చేస్తే available box లో text వస్తుంది — typing అవసరం లేదు
const QUICK_KEYS = ['q_now','q_team','q_vehicle','q_exp','q_weekend','q_parttime'];
const quickBox = document.getElementById('quickChips');
const availEl = document.getElementById('available');

function buildQuickChips(){
  quickBox.innerHTML = '';
  QUICK_KEYS.forEach(k=>{
    const c = document.createElement('div');
    c.className = 'qchip';
    c.textContent = t(k);
    c.onclick = ()=>{
      c.classList.toggle('on');
      // ఎంచుకున్న chips అన్నీ కలిపి text తయారు చేయి
      const picked = Array.from(quickBox.querySelectorAll('.qchip.on')).map(x=>x.textContent);
      availEl.value = picked.join(' · ');
    };
    quickBox.appendChild(c);
  });
}
buildQuickChips();
</script>
<script>
// Service worker register — offline support + home screen install
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
